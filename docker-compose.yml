# =============================================================================
# fides-dsar-demo
#
#   docker compose up
#
# brings up, in dependency order:
#
#   fides-db        Fides' own Postgres (its application database)
#   fides-redis     Fides' Redis (Celery broker + DSR result cache)
#   fides           Fides webserver + Admin UI            -> localhost:8080
#   fides-worker    Celery worker that executes the DSRs
#   app-postgres    demo app data: users + orders          -> localhost:6432
#   app-mongo       demo app data: events                  -> localhost:37017
#   fides-provisioner  one-shot: loads /fides-config into Fides, then exits 0
#   fastapi-gateway my DSAR API, Swagger at /docs          -> localhost:8000
#   presidio        PII detection microservice (Presidio)  -> localhost:8001
#   cms-db          the CMS backend's own Postgres           -> localhost:6543
#   cms-backend     multi-tenant CMS API, Swagger at /docs   -> localhost:8100
#   cms-frontend    DataShield CMS (DPDP consent management) -> localhost:5173
#
# Base layout follows Fides' own sample deployment (`fides deploy up`), i.e.
# src/fides/data/sample_project/docker-compose.yml in the fides repo.
# Reference: https://ethyca.com/docs/dev-docs/get-started/quickstart
# =============================================================================
name: fides-dsar-demo

# -----------------------------------------------------------------------------
# Every Fides process (webserver, worker, provisioner CLI) needs the same
# config. Defined once here and merged into all three.
#
# fides-config/fides.toml holds the non-secret defaults; these FIDES__* env vars
# override the secrets from .env. Env always wins over the TOML file.
# Reference: https://ethyca.com/docs/dev-docs/configuration/configuration
# -----------------------------------------------------------------------------
x-fides-env: &fides-env
  FIDES__CONFIG_PATH: /fides-config/fides.toml

  FIDES__DATABASE__SERVER: fides-db
  FIDES__DATABASE__PORT: "5432"
  FIDES__DATABASE__USER: ${FIDES_DB_USER}
  FIDES__DATABASE__PASSWORD: ${FIDES_DB_PASSWORD}
  FIDES__DATABASE__DB: ${FIDES_DB_NAME}

  FIDES__REDIS__HOST: fides-redis
  FIDES__REDIS__PORT: "6379"
  FIDES__REDIS__PASSWORD: ${FIDES_REDIS_PASSWORD}

  FIDES__SECURITY__APP_ENCRYPTION_KEY: ${FIDES_APP_ENCRYPTION_KEY}
  FIDES__SECURITY__OAUTH_ROOT_CLIENT_ID: ${FIDES_OAUTH_ROOT_CLIENT_ID}
  FIDES__SECURITY__OAUTH_ROOT_CLIENT_SECRET: ${FIDES_OAUTH_ROOT_CLIENT_SECRET}
  FIDES__SECURITY__ROOT_USERNAME: ${FIDES_ROOT_USERNAME}
  FIDES__SECURITY__ROOT_PASSWORD: ${FIDES_ROOT_PASSWORD}

  # DSRs are dispatched to fides-worker over Redis rather than executed inline.
  # This is the shape a real deployment has, and it is what Fides' "DSR 3.0"
  # request-task graph expects. Flip to True and drop the worker service if you
  # want single-process execution.
  # Reference: https://ethyca.com/docs/dev-docs/configuration/configuration#celery
  FIDES__CELERY__TASK_ALWAYS_EAGER: "False"

  FIDES__USER__ANALYTICS_OPT_OUT: "True"

services:
  # ===========================================================================
  # 1. Fides platform
  # ===========================================================================

  # --- Fides' own application database ---------------------------------------
  # postgres:12 matches Fides' sample deployment. Not the DSAR target.
  fides-db:
    image: postgres:12
    environment:
      POSTGRES_USER: ${FIDES_DB_USER}
      POSTGRES_PASSWORD: ${FIDES_DB_PASSWORD}
      POSTGRES_DB: ${FIDES_DB_NAME}
    volumes:
      - fides-db-data:/var/lib/postgresql/data
    ports:
      # Exposed only for debugging Fides itself.
      - "${FIDES_DB_HOST_PORT:-7432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIDES_DB_USER} -d ${FIDES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Fides' Redis ----------------------------------------------------------
  fides-redis:
    image: redis:6.2-alpine
    command: redis-server --requirepass ${FIDES_REDIS_PASSWORD}
    ports:
      - "${FIDES_REDIS_HOST_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FIDES_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Fides webserver + Admin UI -------------------------------------------
  fides:
    # Pinned for reproducibility. Bump via FIDES_IMAGE_TAG in .env.
    # Tags: https://hub.docker.com/r/ethyca/fides/tags
    image: ethyca/fides:${FIDES_IMAGE_TAG:-2.86.2}
    command: fides webserver
    depends_on:
      fides-db:
        condition: service_healthy
      fides-redis:
        condition: service_healthy
    environment: *fides-env
    volumes:
      - ./fides-config:/fides-config:ro
      # Access-request packages land here. The `local` storage destination
      # writes to ./fides_uploads relative to the container's workdir (/fides),
      # so this bind mount surfaces them on the host.
      - ./fides_uploads:/fides/fides_uploads
    ports:
      - "${FIDES_PORT:-8080}:8080"
    healthcheck:
      # The image is python-slim and ships no curl, so use python itself.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',
          timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 30
      # First boot runs the Alembic migrations, which takes a while.
      start_period: 120s

  # --- Celery worker: this is the process that actually runs a DSAR ----------
  fides-worker:
    image: ethyca/fides:${FIDES_IMAGE_TAG:-2.86.2}
    command: fides worker
    depends_on:
      fides:
        condition: service_healthy
    environment: *fides-env
    volumes:
      - ./fides-config:/fides-config:ro
      # Must see the same upload directory as the webserver: the worker is what
      # writes the access package.
      - ./fides_uploads:/fides/fides_uploads
    restart: unless-stopped

  # ===========================================================================
  # 2. The application data being DSAR'd
  # ===========================================================================

  # --- app-postgres: users + orders -----------------------------------------
  app-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      # Runs once, on first volume creation. `docker compose down -v` re-seeds.
      - ./app-postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${APP_POSTGRES_HOST_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER} -d ${APP_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- app-mongo: events ----------------------------------------------------
  app-mongo:
    image: mongo:7.0
    environment:
      # Root user, created in the `admin` database by the image entrypoint.
      MONGO_INITDB_ROOT_USERNAME: ${APP_MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${APP_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${APP_MONGO_DB}
      # Read by init/00_create_app_user.sh, which creates the least-privilege
      # user that Fides connects as. Fides authenticates against `defaultauthdb`
      # (= appdb), so the user must live in appdb, not in admin.
      APP_MONGO_USER: ${APP_MONGO_USER}
      APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD}
    volumes:
      - app-mongo-data:/data/db
      - ./app-mongo/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${APP_MONGO_HOST_PORT:-37017}:27017"
    healthcheck:
      # `ping` is one of the few commands allowed pre-authentication.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # --- app-mysql: customer support tickets ---------------------------------
  app-mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${APP_MYSQL_DB}
      MYSQL_USER: ${APP_MYSQL_USER}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD}
    volumes:
      - app-mysql-data:/var/lib/mysql
      - ./app-mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${APP_MYSQL_HOST_PORT:-6306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ===========================================================================
  # 3. One-shot provisioner — this is what makes `docker compose up` leave
  #    Fides fully configured.
  # ===========================================================================
  # Uses the SAME image as the server so the `fides` CLI is available for
  # `fides push`. Exits 0 when done; `docker compose up` will show it as
  # "exited (0)" and that is the success signal.
  fides-provisioner:
    image: ethyca/fides:${FIDES_IMAGE_TAG:-2.86.2}
    command: python /fides-config/provision/provision.py
    depends_on:
      fides:
        condition: service_healthy
      # Both app databases must be reachable: the provisioner verifies each
      # connection for real (PUT /connection/{key}/secret?verify=true) and
      # fails the boot if a credential is wrong.
      app-postgres:
        condition: service_healthy
      app-mongo:
        condition: service_healthy
      app-mysql:
        condition: service_healthy
    environment:
      <<: *fides-env
      FIDES_URL: http://fides:8080
      FIDES_ROOT_USERNAME: ${FIDES_ROOT_USERNAME}
      FIDES_ROOT_PASSWORD: ${FIDES_ROOT_PASSWORD}
      FIDES_CONFIG_DIR: /fides-config
      # Expanded into fides-config/connections/connections.yml at load time, so
      # no secret is ever committed.
      APP_POSTGRES_HOST: ${APP_POSTGRES_HOST}
      APP_POSTGRES_PORT: ${APP_POSTGRES_PORT}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      APP_MONGO_HOST: ${APP_MONGO_HOST}
      APP_MONGO_PORT: ${APP_MONGO_PORT}
      APP_MONGO_DB: ${APP_MONGO_DB}
      APP_MONGO_USER: ${APP_MONGO_USER}
      APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD}
      # Zoho CRM (custom SaaS connector). ZOHO_CRM_DOMAIN is expanded into
      # connections.yml like the vars above; the CLIENT_ID/SECRET/REFRESH_TOKEN
      # trio is read directly by refresh_zoho_access_token() in provision.py,
      # not expanded into any YAML file.
      ZOHO_CRM_DOMAIN: ${ZOHO_CRM_DOMAIN}
      ZOHO_CRM_ACCOUNTS_DOMAIN: ${ZOHO_CRM_ACCOUNTS_DOMAIN}
      ZOHO_CRM_CLIENT_ID: ${ZOHO_CRM_CLIENT_ID}
      ZOHO_CRM_CLIENT_SECRET: ${ZOHO_CRM_CLIENT_SECRET}
      ZOHO_CRM_REFRESH_TOKEN: ${ZOHO_CRM_REFRESH_TOKEN}
      APP_MYSQL_HOST: ${APP_MYSQL_HOST}
      APP_MYSQL_PORT: ${APP_MYSQL_PORT}
      APP_MYSQL_DB: ${APP_MYSQL_DB}
      APP_MYSQL_USER: ${APP_MYSQL_USER}
      APP_MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD}
      # Only used for the "here is where to go next" banner it prints.
      FIDES_PORT: ${FIDES_PORT:-8080}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
    volumes:
      - ./fides-config:/fides-config:ro
    restart: "no"

  # ===========================================================================
  # 4. DataShield backend — the multi-tenant CMS API
  # ===========================================================================
  # Its own Postgres, separate from app-postgres (demo data being DSAR'd) and
  # fides-db (Fides' own records). See backend/ARCHITECTURE.md.
  cms-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CMS_DB_ROOT_PASSWORD:-postgres}
      POSTGRES_DB: datashield
    volumes:
      - cms-db-data:/var/lib/postgresql/data
      # Creates the two roles the migration expects: an owner for migrations and
      # a restricted app role that RLS actually applies to.
      - ./backend/scripts_bootstrap.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
    ports:
      - "${CMS_DB_HOST_PORT:-6543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datashield"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Migrations, as their own unit of work.
  #
  # This used to be `alembic upgrade head && uvicorn ...` inside cms-backend's
  # command. That is fine with exactly one replica and wrong with two: both race
  # to migrate on boot. It also meant the image could not be deployed without
  # also granting it schema-altering rights, which defeats the point of running
  # the app on a restricted role. Runs to completion, then the app starts.
  # The scheduler. One process, not a thread in the API: with several API replicas
  # a thread would run once per replica, and background work would compete with
  # request serving on the same event loop. Safe to run exactly one of — each job
  # takes a Postgres advisory lock, so a second copy records `skipped_locked`
  # rather than doing the work twice.
  cms-scheduler:
    build:
      context: ./backend
      target: runtime
    depends_on:
      cms-db:
        condition: service_healthy
      cms-migrate:
        condition: service_completed_successfully
    environment:
      DS_ENV: ${DS_ENV:-dev}
      DS_DATABASE_URL: postgresql+asyncpg://datashield_app:apppassword@cms-db:5432/datashield
      DS_DATABASE_OWNER_URL: postgresql+asyncpg://datashield_owner:ownerpassword@cms-db:5432/datashield
      DS_JWT_SECRET: ${DS_JWT_SECRET}
      DS_AUDIT_HMAC_KEY: ${DS_AUDIT_HMAC_KEY}
      # The scheduler sends real notifications, so it needs the same provider
      # settings as the API. With the default console provider it logs instead.
      DS_NOTIFICATION_PROVIDER: ${DS_NOTIFICATION_PROVIDER:-console}
      DS_NOTIFICATION_FROM_ADDRESS: ${DS_NOTIFICATION_FROM_ADDRESS:-}
      DS_SMTP_HOST: ${DS_SMTP_HOST:-}
      DS_SMTP_PORT: ${DS_SMTP_PORT:-587}
      DS_SMTP_USE_TLS: ${DS_SMTP_USE_TLS:-true}
      DS_SMTP_USERNAME: ${DS_SMTP_USERNAME:-}
      DS_SMTP_PASSWORD: ${DS_SMTP_PASSWORD:-}
      DS_ACS_ENDPOINT: ${DS_ACS_ENDPOINT:-}
      DS_ACS_ACCESS_KEY: ${DS_ACS_ACCESS_KEY:-}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

  cms-migrate:
    build:
      context: ./backend
      target: runtime
    depends_on:
      cms-db:
        condition: service_healthy
    environment:
      DS_ENV: ${DS_ENV:-dev}
      DS_DATABASE_URL: postgresql+asyncpg://datashield_app:apppassword@cms-db:5432/datashield
      DS_DATABASE_OWNER_URL: postgresql+asyncpg://datashield_owner:ownerpassword@cms-db:5432/datashield
      DS_JWT_SECRET: ${DS_JWT_SECRET}
      DS_AUDIT_HMAC_KEY: ${DS_AUDIT_HMAC_KEY}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Test runner. Uses the `dev` target, which is the runtime image plus pytest —
  # so the tests exercise the same layers that deploy, without pytest shipping
  # to production. Run: docker compose run --rm cms-test
  cms-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    depends_on:
      cms-db:
        condition: service_healthy
    environment:
      # A DIFFERENT database from the one cms-backend serves. The suite
      # truncates every table between tests; pointed at the app's database it
      # destroys local demo data on every run — which is how this was found.
      DS_DATABASE_URL: postgresql+asyncpg://datashield_app:apppassword@cms-db:5432/datashield_test
      DS_DATABASE_OWNER_URL: postgresql+asyncpg://datashield_owner:ownerpassword@cms-db:5432/datashield_test
      DS_JWT_SECRET: ${DS_JWT_SECRET}
      DS_AUDIT_HMAC_KEY: ${DS_AUDIT_HMAC_KEY}
    volumes:
      # Source mounted so a test edit does not need an image rebuild. The venv
      # lives at /opt/venv, outside this mount, so it is not shadowed.
      - ./backend:/srv
      # The edge config, read-only. One test asserts nginx proxies /public/ —
      # a deploy-time failure no ASGI-level test can catch, so the file has to
      # be visible to the suite rather than checked by hand.
      - ./frontend/nginx.conf.template:/frontend/nginx.conf.template:ro
    # Migrate the test database first: it is a separate database, so nothing
    # else will have done it, and a suite on a stale schema fails in ways that
    # look like product bugs.
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]
    restart: "no"

  cms-backend:
    build:
      context: ./backend
      target: runtime
    depends_on:
      cms-db:
        condition: service_healthy
      cms-migrate:
        condition: service_completed_successfully
    environment:
      DS_ENV: ${DS_ENV:-dev}
      DS_DEBUG: ${DS_DEBUG:-true}
      DS_DATABASE_URL: postgresql+asyncpg://datashield_app:apppassword@cms-db:5432/datashield
      DS_DATABASE_OWNER_URL: postgresql+asyncpg://datashield_owner:ownerpassword@cms-db:5432/datashield
      DS_JWT_SECRET: ${DS_JWT_SECRET}
      DS_AUDIT_HMAC_KEY: ${DS_AUDIT_HMAC_KEY}
      DS_COOKIE_SECURE: ${DS_COOKIE_SECURE:-false}
      # Notifications. `console` logs instead of sending, which is why it is safe
      # as a default and why the backend refuses it in prod.
      DS_NOTIFICATION_PROVIDER: ${DS_NOTIFICATION_PROVIDER:-console}
      DS_NOTIFICATION_FROM_ADDRESS: ${DS_NOTIFICATION_FROM_ADDRESS:-}
      DS_SMTP_HOST: ${DS_SMTP_HOST:-}
      DS_SMTP_PORT: ${DS_SMTP_PORT:-587}
      DS_SMTP_USE_TLS: ${DS_SMTP_USE_TLS:-true}
      DS_SMTP_USERNAME: ${DS_SMTP_USERNAME:-}
      DS_SMTP_PASSWORD: ${DS_SMTP_PASSWORD:-}
      DS_ACS_ENDPOINT: ${DS_ACS_ENDPOINT:-}
      DS_ACS_ACCESS_KEY: ${DS_ACS_ACCESS_KEY:-}
      # nginx mounts this API at /api, so the refresh cookie must be scoped there.
      # Scoped to /v1/auth instead, the browser holds a cookie it never sends
      # back: sign-in works, the next reload signs you out, and nothing is logged.
      DS_EXTERNAL_PATH_PREFIX: ${DS_EXTERNAL_PATH_PREFIX:-/api}
      DS_CORS_ORIGINS: '["http://localhost:${CMS_PORT:-5173}"]'
    ports:
      - "${CMS_BACKEND_PORT:-8100}:8100"
    # No command override: the image's CMD starts uvicorn. Migrations already
    # ran in cms-migrate, which this service waits for.
    restart: unless-stopped

  # ===========================================================================
  # 5. DataShield CMS — the DPDP consent-management frontend
  # ===========================================================================
  # A separate React/Vite app from the DSAR console the gateway serves at
  # :8000/ui. It runs on mock data by default (see frontend/src/api/index.js);
  # flip USE_REAL_DSAR_BACKEND there to route its DSAR calls through the /gateway
  # proxy into Fides.
  # The production image, and the ONLY service that should ever be published to
  # the internet. nginx serves the built app and reverse-proxies /api and
  # /gateway from the same origin — see frontend/nginx.conf.template for why
  # that is a correctness requirement and not a deployment preference.
  cms-frontend:
    build:
      context: ./frontend
      args:
        # Stamped into the bundle so a running container names its own commit.
        VITE_BUILD_SHA: ${BUILD_SHA:-dev}
        # The consent banners' publishable key. Public by design — it can only
        # collect consent, is origin-pinned, and stamps provenance on every
        # record. Issue one per environment from Admin -> publishable keys.
        VITE_PUBLISHABLE_KEY: ${VITE_PUBLISHABLE_KEY:-}
    environment:
      BACKEND_URL: http://cms-backend:8100
      GATEWAY_URL: http://fastapi-gateway:8000
    ports:
      # 8080 inside the container. The host port defaults to 8090 because Fides
      # already owns 8080 locally; in Azure this is the app's only ingress.
      - "${WEB_PORT:-8090}:8080"
    depends_on:
      fastapi-gateway:
        condition: service_started
      cms-backend:
        condition: service_started
    restart: unless-stopped

  # Hot-reload development server. Not started by default — bring it up
  # explicitly with `docker compose --profile dev up cms-frontend-dev`, or just
  # run `npm run dev` on the host. It is kept because losing hot reload would be
  # a real cost to whoever is building screens, but it must never be the thing
  # that gets deployed, so it sits behind a profile.
  cms-frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      BACKEND_URL: http://cms-backend:8100
      GATEWAY_URL: http://fastapi-gateway:8000
    volumes:
      # Source mounted for hot reload; node_modules stays the image's copy so a
      # host install (or its absence) can't shadow it.
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${CMS_PORT:-5173}:5173"
    restart: unless-stopped

  # ===========================================================================
  # 6. My FastAPI wrapper around the Fides API (the DSAR engine demo)
  # ===========================================================================
  fastapi-gateway:
    build:
      context: ./fastapi-gateway
    depends_on:
      fides:
        condition: service_healthy
      # Wait for provisioning so the policy keys the gateway posts actually
      # exist by the time the port is open.
      fides-provisioner:
        condition: service_completed_successfully
      # POST /data/subject writes to both application databases directly.
      app-postgres:
        condition: service_healthy
      app-mongo:
        condition: service_healthy
      app-mysql:
        condition: service_healthy
    environment:
      FIDES_URL: ${FIDES_URL:-http://fides:8080}
      FIDES_ROOT_USERNAME: ${FIDES_ROOT_USERNAME}
      FIDES_ROOT_PASSWORD: ${FIDES_ROOT_PASSWORD}
      # Same credentials the Fides ConnectionConfigs use, so anything inserted
      # through POST /data/subject is reachable by a DSAR.
      APP_POSTGRES_HOST: ${APP_POSTGRES_HOST}
      APP_POSTGRES_PORT: ${APP_POSTGRES_PORT}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      APP_MONGO_HOST: ${APP_MONGO_HOST}
      APP_MONGO_PORT: ${APP_MONGO_PORT}
      # = the app_mongo_dataset fides_key; see resources/app_mongo_dataset.yml.
      APP_MONGO_DB: ${APP_MONGO_DB}
      APP_MONGO_USER: ${APP_MONGO_USER}
      APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD}
      # Zoho CRM — read directly by app/zoho_client.py so GET /data/subject/{email}
      # can check Zoho itself, the same way it already checks the two app
      # databases directly, with no Fides in the path.
      ZOHO_CRM_DOMAIN: ${ZOHO_CRM_DOMAIN}
      ZOHO_CRM_ACCOUNTS_DOMAIN: ${ZOHO_CRM_ACCOUNTS_DOMAIN}
      ZOHO_CRM_CLIENT_ID: ${ZOHO_CRM_CLIENT_ID}
      ZOHO_CRM_CLIENT_SECRET: ${ZOHO_CRM_CLIENT_SECRET}
      ZOHO_CRM_REFRESH_TOKEN: ${ZOHO_CRM_REFRESH_TOKEN}
      APP_MYSQL_HOST: ${APP_MYSQL_HOST}
      APP_MYSQL_PORT: ${APP_MYSQL_PORT}
      APP_MYSQL_DB: ${APP_MYSQL_DB}
      APP_MYSQL_USER: ${APP_MYSQL_USER}
      APP_MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD}
      # Must match the keys in fides-config/policies/dsr_policies.yml.
      ACCESS_POLICY_KEY: ${ACCESS_POLICY_KEY:-demo_access_policy}
      ERASURE_POLICY_KEY: ${ERASURE_POLICY_KEY:-demo_erasure_policy}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      ACCESS_PACKAGE_DIR: /access-packages
      # The console at /ui links to the Fides Admin UI, which a browser reaches
      # on the published host port — not at http://fides:8080.
      FIDES_ADMIN_URL: http://localhost:${FIDES_PORT:-8080}
    volumes:
      # Read-only view of the same directory the Fides worker writes access
      # packages into. Fides has no API that returns the rows for a real privacy
      # request (`filtered-results` is test-request-only, `access-results` only
      # returns the storage location), so the gateway reads the package to serve
      # `data` inline. With an S3/GCS destination it would GET the presigned URL
      # instead and this mount would go away.
      - ./fides_uploads:/access-packages:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',
          timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ===========================================================================
  # 5. Presidio-based PII detection microservice
  # ===========================================================================
  # Standalone FastAPI wrapper around Presidio (+ custom IN_PAN/IN_AADHAAR
  # recognizers). Not wired into the DSAR flow yet — exposed standalone so
  # other services can POST /detect against it.
  presidio:
    build:
      context: ./presidio
    ports:
      - "${PRESIDIO_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',
          timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  cms-db-data:
  fides-db-data:
  app-postgres-data:
  app-mongo-data:
  app-mysql-data:
