# Alembic from commit one. Schema changes are reviewed migrations, never manual
# ALTERs — this is compliance data.
#
# Migrations run as the OWNER role (DS_DATABASE_OWNER_URL); the application
# connects as a restricted role that RLS applies to. env.py enforces that split.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamped revision files sort chronologically, which makes review and
# cherry-picking sane.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
